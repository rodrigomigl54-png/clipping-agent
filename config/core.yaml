id: core
display_name: CORE Clipper
output_folder: CORE
min_quality_threshold: 60
duration:
  min_seconds: 15
  max_seconds: 180
  ideal_ranges:
    direct: [15, 30]
    context: [30, 60]
    story: [60, 120]
    exceptional: [120, 180]

# Equal initial attention (~1/6 each). Not a clip quota.
creators:
  - {name: Adapt,          priority: equal, aliases: [adapt],                 hashtags: [adapt],          youtube_channel_ids: [], youtube_handles: ["@AdaptLive", "@adapt"]}
  - {name: Silky,          priority: equal, aliases: [silky],                 hashtags: [silky],          youtube_channel_ids: [], youtube_handles: []}
  - {name: JasonTheWeen,   priority: equal, aliases: [jason, jasontheween],   hashtags: [jasontheween],   youtube_channel_ids: [], youtube_handles: ["@JasonTheWeenie"]}
  - {name: Lacy,           priority: equal, aliases: [lacy],                  hashtags: [lacy],           youtube_channel_ids: [], youtube_handles: ["@LacyHimself"]}
  - {name: Marlon,         priority: equal, aliases: [marlon],                hashtags: [marlon],         youtube_channel_ids: [], youtube_handles: ["@Mar3LG"]}
  - {name: Stable Ronaldo, priority: equal, aliases: [ronaldo, stable, stable ronaldo], hashtags: [stableronaldo], youtube_channel_ids: [], youtube_handles: ["@StableRonaldoLive"]}
group_name: CORE
group_youtube_handles: ["@createownruneverything"]
content_categories: [individual, duo_interaction, full_group, official_video, challenge, argument_debate, reaction, funny_interaction, unexpected_group_moment]
affiliates_are_members: false

attention:
  dynamic: true
  min_multiplier: 0.5
  max_multiplier: 2.0
  learning_rate: 0.2

scoring_weights:
  hook_strength: 1.1
  entertainment: 1.2
  emotional_impact: 1.0
  context_completeness: 1.3
  story_progression: 1.0
  payoff_strength: 1.2
  originality: 0.7
  shareability: 1.0
  visual_quality: 0.5
  audio_quality: 0.7
  platform_suitability: 0.8
  group_chemistry: 1.6           # interaction-driven profile

features:
  cross_stream_detection: true
  allow_multiple_perspectives: false
  group_chemistry: true
  cross_profile_duplicate_check: true

editing:
  style: personality
  layout_policy: auto
  caption:
    font: DejaVu Sans
    font_file: null
    size: 72
    primary_color: "#FFFFFF"
    highlight_color: "#4FD1FF"
    outline_color: "#000000"
    outline: 5
    shadow: 2
    bold: true
    uppercase: false
    max_words: 4
    max_chars: 26
    position: 0.68
  zoom_emphasis: true

metadata:
  base_hashtags: [core, shorts, streamer, funny]
  max_hashtags: 8
  title_max_chars: 90
